name: CI

# M-12: Menambahkan CI gate untuk jalur kritis backend (login/aktivasi, kredit/pemakaian poin, dan idempotensi upsert sync) dengan pengujian berbasis mock Prisma tanpa memerlukan database atau secrets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job ini sengaja TIDAK punya blok `env:` dan tidak memakai secret apa pun:
  # seluruh test unit wajib hermetik (mock Prisma / client yang di-inject).
  #
  # Kalau job ini merah karena sebuah variabel environment "hilang", perbaikan
  # yang benar adalah menyuntikkan dependensi dari test-nya, BUKAN menambahkan
  # nilai placeholder di sini. Menambahkan mis. DIRECT_URL palsu akan menutupi
  # jaminan fail-closed advisory lock (M-3) tanpa ada yang menyadarinya.
  #
  # Catatan jebakan: di laptop, `@prisma/client` memuat .env saat di-import,
  # sehingga test bisa hijau lokal tapi merah di CI (checkout CI tidak punya
  # .env). Untuk mereproduksi CI secara lokal, jalankan `npm test` dengan .env
  # dipindahkan sementara ke luar folder.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crisbro_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crisbro_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/crisbro_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration:postgres
