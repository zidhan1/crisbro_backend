openapi: 3.0.3
info:
  title: Crisbro Rewards API
  version: 2.0.0
  description: >
    Dokumentasi API untuk aplikasi Crisbro Rewards.


    Autentikasi memakai JWT melalui cookie sesi `crisbar_session` (diprioritaskan)
    atau header `Authorization: Bearer <token>`. Untuk request non-GET yang
    mengautentikasi lewat cookie, wajib mengirim header `x-csrf-protection: 1`.


    Endpoint admin mengubah database lokal aplikasi. Endpoint sync mengambil
    data dari Runchise ke database lokal, sehingga data lokal yang berasal dari
    Runchise dapat tertimpa saat sync berikutnya berjalan.
servers:
  - url: http://localhost:5002
    description: Local backend
  - url: /
    description: Same origin
tags:
  - name: Health
  - name: Auth
  - name: Customers
  - name: Products
  - name: Promos
  - name: Users
  - name: Referral
  - name: Locations
  - name: Sub Brands
  - name: Sale Transactions
  - name: Webhook Qontak

paths:
  /:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/register:
    post:
      tags: [Auth]
      summary: Registrasi akun customer baru
      description: >-
        Membuat user role customer, membuat/mencocokkan customer di Runchise,
        lalu menghasilkan no. referensi untuk aktivasi via WhatsApp. Respons
        menyertakan teks aktivasi yang harus dikirim user tanpa diubah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created; berisi teks aktivasi WhatsApp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: >-
            Validasi gagal (`success:false` + `errors`) atau phone/email/username
            sudah terdaftar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gagal membuat customer di Runchise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/login:
    post:
      tags: [Auth]
      summary: Login
      description: >-
        Isi salah satu saja antara `phone` atau `email` (tidak keduanya).
        Rate limit: 10 permintaan/IP/2 menit dan 20 percobaan/akun/2 menit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >-
            Login berhasil. Token disetel sebagai cookie sesi httpOnly
            `crisbar_session` dan tidak dikirim di body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Kredensial salah atau akun belum aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/send-otp:
    post:
      tags: [Auth]
      summary: Generate no. referensi untuk aktivasi WhatsApp
      description: >-
        Membuat no. referensi baru bagi user yang login dan mengembalikan teks
        aktivasi yang harus diteruskan user ke bot WhatsApp Crisbro tanpa
        diubah. Rate limit: 10 permintaan/IP/2 menit.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: No. referensi baru dan teks aktivasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          text:
                            type: string
                            example: >-
                              AKTIVASI CRISBRO\nHarap kirim pesan ini tanpa
                              merubah apapun.\nNo.ref:AB12CD34EF
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/verify-otp:
    post:
      tags: [Auth]
      summary: Validasi OTP / kode aktivasi
      description: "Rate limit: 10 permintaan/IP/2 menit."
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_code]
              properties:
                otp_code:
                  type: string
      responses:
        "200":
          description: Validasi berhasil; mengembalikan data user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/logout:
    post:
      tags: [Auth]
      summary: Keluar dari sesi saat ini
      description: Menghapus cookie sesi `crisbar_session`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Berhasil keluar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/logout-all:
    post:
      tags: [Auth]
      summary: Keluar dari semua sesi
      description: >-
        Schema JWT stateless tidak menyimpan sesi per perangkat, sehingga
        endpoint ini hanya menghapus cookie sesi saat ini.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Sesi saat ini dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  revoked_sessions:
                    type: integer
                    example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profile:
    get:
      tags: [Auth]
      summary: Profil user yang sedang login
      description: Hanya untuk user yang nomor teleponnya sudah terverifikasi.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Data user beserta relasi customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Nomor telepon belum terverifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/me:
    get:
      tags: [Auth]
      summary: Profil user yang sedang login (marketing & admin)
      description: >-
        Khusus role marketing dan admin. Tidak memerlukan verifikasi nomor
        telepon. Responsnya sama dengan /api/profile.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Data user yang sedang login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/change-password:
    post:
      tags: [Auth]
      summary: Ganti password
      description: >-
        Password baru minimal 8 karakter dan harus berbeda dari password lama.
        Setelah berhasil, cookie sesi dihapus dan user harus login ulang.
        Rate limit: 10 permintaan/IP/2 menit.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Password diganti; login ulang diperlukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Password lama kosong, password baru < 8 karakter, atau sama dengan password lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password lama salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Akun belum memiliki password aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/customers:
    get:
      tags: [Customers]
      summary: List customer (paginated)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/SearchQuery"
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [created_at, name, phone_number, status]
            default: created_at
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Daftar customer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/Customer"
                          meta:
                            $ref: "#/components/schemas/PageMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/customers/me:
    get:
      tags: [Customers]
      summary: Profil customer yang sedang login
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Data customer milik user yang login
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      summary: Update profil customer yang sedang login
      description: >-
        Field yang diizinkan sama dengan PATCH /api/customers/{customer_id}
        kecuali `status` dan `owner_location_id` (khusus admin). Minimal satu
        field harus dikirim.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSelfUpdateRequest"
      responses:
        "200":
          description: Profil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/customers/{customer_id}:
    get:
      tags: [Customers]
      summary: Detail customer by ID
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerIdPath"
      responses:
        "200":
          description: Data customer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Customers]
      summary: Update customer by ID
      description: >-
        Perubahan diteruskan ke Runchise terlebih dahulu; field berasal dari
        Runchise dapat tertimpa saat sync berikutnya. Minimal satu field harus
        dikirim. Perubahan nomor telepon menonaktifkan akun dan membatalkan
        verifikasi telepon (user harus aktivasi ulang via WhatsApp).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateRequest"
      responses:
        "200":
          description: Customer diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Nomor telepon sudah dipakai user lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Body kosong/tidak valid atau customer belum terhubung ke Runchise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/customers/user/{user_id}:
    get:
      tags: [Customers]
      summary: Cari customer berdasarkan user ID
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Data customer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/products:
    get:
      tags: [Products]
      summary: List loyalty products
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: query
          description: Cari berdasarkan nama atau SKU produk
          schema:
            type: string
            default: ""
        - in: query
          name: take
          description: Jumlah item per halaman (maksimal 100)
          schema:
            type: integer
            default: 10
        - in: query
          name: skip
          description: Jumlah item yang dilewati
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Daftar loyalty product
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total:
                            type: integer
                          total_page:
                            type: integer
                          loyalty_products:
                            type: array
                            items:
                              $ref: "#/components/schemas/LoyaltyProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/products/sync-loyalty-products:
    post:
      tags: [Products]
      summary: Sinkronisasi loyalty products dari Runchise
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Hasil sinkronisasi loyalty products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/LoyaltyProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/products/{loyalty_product_id}:
    delete:
      tags: [Products]
      summary: Hapus loyalty product lokal
      description: Hanya menghapus dari database lokal; tidak menghapus data di Runchise.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: loyalty_product_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Produk terhapus
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoyaltyProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/promos:
    get:
      tags: [Promos]
      summary: List promo lokal (paginated)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - in: query
          name: limit
          description: Maksimal 100
          schema:
            type: integer
            default: 10
        - $ref: "#/components/parameters/SearchQuery"
        - in: query
          name: status
          schema:
            type: string
          description: Filter status promo, mis. active
        - in: query
          name: channel
          schema:
            type: string
        - in: query
          name: location_id
          description: UUID lokasi; promo yang berlaku di lokasi ini
          schema:
            type: string
            format: uuid
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [created_at, updated_at, name, status, start_date, end_date]
            default: created_at
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: >-
            Daftar promo. Item list tidak menyertakan `promo_codes` agar tidak
            memuat seluruh kode pada tiap request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: "#/components/schemas/PromoDetail"
                          meta:
                            $ref: "#/components/schemas/PageMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Promos]
      summary: Buat promo di Runchise lalu sinkron ke lokal
      description: >-
        Membuat promo pada Runchise, lalu menyimpan hasil sinkronisasi ke
        database lokal. Jika create Runchise berhasil tetapi sinkronisasi lokal
        gagal, respons 502 berisi `runchise_id` — pulihkan dengan
        POST /api/promos/sync/{runchise_id} dan JANGAN mengulang create.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCreateRequest"
      responses:
        "201":
          description: Promo dibuat dan tersinkron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/PromoSyncFailed"

  /api/promos/{promo_id}:
    get:
      tags: [Promos]
      summary: Detail promo lokal
      description: Menyertakan seluruh promo code yang tersimpan.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PromoIdPath"
      responses:
        "200":
          description: Detail promo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Promos]
      summary: Update promo di Runchise lalu sinkron ke lokal
      description: >-
        Update ditujukan ke Runchise, kemudian representasi penuh dibaca ulang
        dan disinkronkan ke lokal. Minimal satu field harus dikirim.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PromoIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoUpdateRequest"
      responses:
        "200":
          description: Promo diperbarui dan tersinkron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/PromoSyncFailed"

  /api/promos/{promo_id}/activate:
    patch:
      tags: [Promos]
      summary: Aktifkan promo
      description: Mengaktifkan promo di Runchise lalu menyegarkan data lokal.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PromoIdPath"
      responses:
        "200":
          description: Promo diaktifkan; mengembalikan detail tersinkron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/PromoSyncFailed"

  /api/promos/{promo_id}/deactivate:
    patch:
      tags: [Promos]
      summary: Nonaktifkan promo
      description: Menonaktifkan promo di Runchise lalu menyegarkan data lokal.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PromoIdPath"
      responses:
        "200":
          description: Promo dinonaktifkan; mengembalikan detail tersinkron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/PromoSyncFailed"

  /api/promos/{promo_id}/promo-codes/generate:
    post:
      tags: [Promos]
      summary: Generate promo code tambahan
      description: >-
        Promo harus sudah mengaktifkan `use_promotion_code`. `total_code` wajib
        bilangan bulat 1-1000; field tak dikenal ditolak. `promo_codes` pada
        respons berisi seluruh kode tersimpan, bukan hanya batch baru. Jika
        generate berhasil tetapi sinkronisasi gagal, pulihkan lewat
        POST /api/promos/sync/{runchise_id} dan jangan mengulang generate.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PromoIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total_code]
              properties:
                total_code:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  example: 10
      responses:
        "201":
          description: Kode dibuat dan tersinkron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Promo belum mengaktifkan penggunaan promotion code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/PromoSyncFailed"

  /api/promos/sync/{runchise_id}:
    post:
      tags: [Promos]
      summary: Pulihkan sinkronisasi promo dari Runchise
      description: >-
        Menyegarkan data lokal dari Runchise tanpa membuat/mengubah promo
        remote. Dipakai untuk pemulihan setelah kegagalan sinkronisasi;
        operasi bersifat idempoten berdasarkan runchise_id unik.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: runchise_id
          required: true
          schema:
            type: integer
            minimum: 1
          description: ID promo di Runchise
      responses:
        "200":
          description: Promo tersinkron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/PromoSyncFailed"

  /api/users:
    post:
      tags: [Users]
      summary: Buat user baru
      description: Membuat user di database lokal aplikasi (tidak membuat customer di Runchise).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: User dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username/email/phone/referral code/no referensi sudah dipakai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/users/{user_id}:
    patch:
      tags: [Users]
      summary: Update user
      description: Minimal satu field harus dikirim.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Email/username/phone/referral code/no referensi sudah dipakai user lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/referral/usages:
    get:
      tags: [Referral]
      summary: List pemakaian kode referral
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, completed]
          description: Kosongkan untuk semua status
      responses:
        "200":
          description: Daftar pemakaian kode referral
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ReferralUsage"
                          meta:
                            type: object
                            properties:
                              total:
                                type: integer
                              status:
                                type: string
                                example: all
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/referral/generate:
    post:
      tags: [Referral]
      summary: Buat kode referral untuk customer yang login
      description: >-
        Body boleh dikosongkan untuk memakai nilai default program (poin reward,
        poin given, dan masa berlaku). Satu user hanya boleh memiliki satu
        program referral.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralProgramRequest"
      responses:
        "200":
          description: Kode referral dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReferralCodeData"
        "400":
          description: Program referral untuk user ini sudah pernah dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/referral/renew:
    patch:
      tags: [Referral]
      summary: Perpanjang kode referral yang sudah kedaluwarsa
      description: Hanya berlaku bila kode referral sebelumnya sudah kedaluwarsa.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralProgramRequest"
      responses:
        "200":
          description: Kode referral diperpanjang
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReferralCodeData"
        "400":
          description: Kode referral belum kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/referral/validate/{user_id}:
    patch:
      tags: [Referral]
      summary: Validasi referral pending milik seorang user
      description: >-
        User target dipilih eksplisit oleh admin/marketing; pelaku request
        bukan pemilik referral yang divalidasi.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Referral divalidasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tidak ada referral pending untuk user tersebut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/locations/generate:
    post:
      tags: [Locations]
      summary: Sinkronisasi lokasi outlet dari Runchise
      description: >-
        Menarik seluruh lokasi dari Runchise dan menyimpannya ke database
        lokal. Sub-brand Runchise harus sudah tersinkron lebih dulu; lokasi
        dengan sub-brand yang belum tersinkron akan ditolak.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Hasil sinkronisasi lokasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/sub_brands:
    get:
      tags: [Sub Brands]
      summary: List sub-brand
      responses:
        "200":
          description: Daftar sub-brand
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SubBrand"

  /api/sub_brands/generate:
    post:
      tags: [Sub Brands]
      summary: Sinkronisasi sub-brand dari Runchise
      description: Menambahkan sub-brand Runchise yang belum ada di database lokal.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Hasil sinkronisasi sub-brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/sale-transactions/generate:
    post:
      tags: [Sale Transactions]
      summary: Tarik sale transactions satu customer dari Runchise
      description: >-
        Menarik seluruh sale transaction milik satu customer dari API Runchise
        (semua halaman) lalu menyimpannya ke tabel SaleTransaction lokal.
        Idempoten: penyimpanan dilakukan dengan upsert by runchise_id sehingga
        pemanggilan berulang tidak menduplikasi transaksi. Transaksi tanpa id
        Runchise atau yang outletnya belum tersinkron dilewati dan dilaporkan
        pada ringkasan balasan. Rate limit: 5 permintaan/customer/2 menit.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: Primary key (customer_id) customer pada database lokal
                  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "200":
          description: Ringkasan hasil generate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SaleTransactionGenerateSummary"
        "400":
          description: Customer belum tersinkron dengan Runchise (runchise_id kosong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Terlalu banyak permintaan generate untuk customer yang sama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/webhook-qontak/733f8d9cc06104f3:
    post:
      tags: [Webhook Qontak]
      summary: Webhook interaksi pesan Qontak
      description: >-
        Menerima callback interaksi WhatsApp dari Qontak. Pesan aktivasi dengan
        teks `AKTIVASI CRISBRO` + no. referensi akan memverifikasi nomor
        telepon user; balasan sukses/gagal dikirim bot ke room yang sama.
        Selalu membalas 200 untuk payload yang sudah diproses agar Qontak
        tidak mengulang pengiriman.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, sender_id, text]
              properties:
                room_id:
                  type: string
                sender_id:
                  type: string
                text:
                  type: string
                  description: Isi pesan; teks aktivasi dibaca per baris
                  example: >-
                    AKTIVASI CRISBRO\nHarap kirim pesan ini tanpa merubah
                    apapun.\nNo.ref:AB12CD34EF
                room:
                  type: object
                  required: [account_uniq_id]
                  properties:
                    account_uniq_id:
                      type: string
                      description: Nomor telepon WhatsApp customer
      responses:
        "200":
          description: Webhook diterima/diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Payload tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: crisbar_session

  parameters:
    PageQuery:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      in: query
      name: limit
      description: Maksimal 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SearchQuery:
      in: query
      name: search
      description: Cari berdasarkan nama atau nomor telepon
      schema:
        type: string
        default: ""
    CustomerIdPath:
      in: path
      name: customer_id
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      in: path
      name: user_id
      required: true
      schema:
        type: string
        format: uuid
    PromoIdPath:
      in: path
      name: promo_id
      required: true
      schema:
        type: string
        format: uuid
      description: UUID promo lokal

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Token tidak ada, tidak valid, atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Role tidak berhak mengakses endpoint ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validasi input gagal (422)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit terlampaui
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Kesalahan server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PromoSyncFailed:
      description: >-
        Mutasi Runchise berhasil tetapi sinkronisasi lokal gagal. `message`
        berisi objek `{code, message, runchise_id}`; pulihkan lewat
        POST /api/promos/sync/{runchise_id} dan jangan ulangi create/generate.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: object
                properties:
                  code:
                    type: string
                    example: PROMO_SYNC_FAILED
                  message:
                    type: string
                  runchise_id:
                    type: integer
              error_id:
                type: string

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      description: >-
        Bentuk error standar. Bergantung sumber error, `message` dapat berupa
        string, objek field errors validasi, atau `errors` berisi peta
        field -> daftar pesan.
      properties:
        message:
          nullable: true
        errors:
          type: object
          nullable: true
          description: Peta field -> daftar pesan error validasi
          additionalProperties:
            type: array
            items:
              type: string
        success:
          type: boolean
          nullable: true
        error_id:
          type: string
          description: ID pelacakan error di log server

    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        message:
          type: string

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    RegisterRequest:
      type: object
      required: [name, phone, username, email, password, location_id]
      properties:
        name:
          type: string
          example: Budi Santoso
        phone:
          type: string
          description: 11-15 digit, tidak diawali 0
          example: "81234567890"
        username:
          type: string
          minLength: 6
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: Minimal 8 karakter, mengandung huruf besar dan angka
        referral_code:
          type: string
          description: Kode referral opsional dari member lain
        location_id:
          type: number
          description: ID lokasi Runchise sebagai owner customer

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Berhasil membuat user dan mengirim otp
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            referral:
              nullable: true
              description: Ringkasan referral bila mendaftar memakai kode referral
            text:
              type: string
              description: Teks aktivasi WhatsApp yang harus dikirim user tanpa diubah

    LoginRequest:
      type: object
      required: [password]
      properties:
        phone:
          type: string
          description: Isi salah satu saja antara phone atau email
          example: "81234567890"
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        expiresIn:
          type: string
          example: 7d
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      description: >-
        Data user tanpa password hash. Field email/phone dihilangkan bila
        kosong.
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, marketing, customer]
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        referral_code:
          type: string
          nullable: true
        no_referensi:
          type: string
          nullable: true
          description: Kode referensi untuk aktivasi WhatsApp
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        customer:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Customer"

    UserRecord:
      type: object
      description: Record user tanpa hash password dan token verifikasi email.

    Customer:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        runchise_id:
          type: integer
          nullable: true
        runchise_location_id:
          type: integer
          nullable: true
        runchise_synced_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        phone_number:
          type: string
          nullable: true
        normalized_phone_number:
          type: string
          nullable: true
        phone_number_country_code:
          type: integer
          example: 62
        address:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        dob:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          nullable: true
          enum: [male, female, unknown, ""]
        status:
          type: string
          nullable: true
          enum: [active, inactive, ""]
        balance:
          type: number
        member_since:
          type: string
          format: date
          nullable: true
        total_point:
          type: integer
        available_point:
          type: integer
        owner_location_id:
          type: string
          nullable: true
        created_by_id:
          type: string
          nullable: true
        last_updated_by_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomerUpdateRequest:
      type: object
      description: Minimal satu field; field tak dikenal ditolak.
      properties:
        name:
          type: string
        phone_number:
          type: string
        address:
          type: string
        province:
          type: string
        city:
          type: string
        country:
          type: string
        postal_code:
          type: string
        gender:
          type: string
          enum: [unknown, male, female]
        status:
          type: string
          enum: [active, inactive]
        owner_location_id:
          type: string
          description: UUID lokasi owner

    CustomerSelfUpdateRequest:
      type: object
      description: >-
        Minimal satu field; `status` dan `owner_location_id` tidak diizinkan
        untuk customer.
      properties:
        name:
          type: string
        phone_number:
          type: string
        address:
          type: string
        province:
          type: string
        city:
          type: string
        country:
          type: string
        postal_code:
          type: string
        gender:
          type: string
          enum: [unknown, male, female]

    LoyaltyProduct:
      type: object
